name: registry

# Rebuilds registry.json and PLUGINS.md from upstream once a day.
#
# It does NOT smoke-test the plugins. Running ~90 scrapers daily from GitHub
# Actions' address space measures Cloudflare's opinion of GitHub Actions, not
# the plugins, and would auto-disable a perfectly healthy registry. Health is
# measured where the service runs — see `utsi probe` in the README.
#
# And it does not merge third-party code changes on its own. Exit code 3 from
# the bot means a plugin was added or the bytes behind an already-trusted pin
# changed — exactly the case the pinning exists to catch — and that run's
# registry lands on a review branch and a pull request, never on main. The
# review used to be an issue opened *after* the push, which made it a
# notification rather than a gate: the pin was already live, and the next
# `./update.sh` anywhere would have run the new bytes with no human in the
# loop. Merging the pull request is now the approval.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Rebuild the registry
        id: build
        run: |
          set +e
          utsi registry-update | tee /tmp/summary.txt
          # $? would be tee's status, not the bot's.
          echo "review=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Job summary
        run: |
          {
            echo "## Registry update"
            echo
            echo '```'
            cat /tmp/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only a clean refresh — exit 0: metadata moves, URL changes behind an
      # unchanged pin, removals — commits straight to main. A run that found
      # new or changed third-party bytes (exit 3) must not reach this step,
      # and neither may a run that failed outright.
      - name: Commit
        id: commit
        if: steps.build.outputs.review == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- registry.json PLUGINS.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add registry.json PLUGINS.md
          git commit -m "chore(registry): daily refresh from upstream"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Exit code 3 means a plugin was added, or the bytes behind an already
      # trusted plugin changed. Both are new third-party code reaching a
      # deployment, which is exactly what must not merge unreviewed — so the
      # updated pins go to a review branch, not to main. One stable branch,
      # force-pushed: while a change sits unreviewed, each nightly run updates
      # the same branch and the same pull request instead of stacking new ones.
      - name: Push the pins to the review branch
        if: steps.build.outputs.review == '3'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B registry-review
          git add registry.json PLUGINS.md
          git commit -m "registry: pin changes awaiting review"
          git push --force origin registry-review

      - name: Open or refresh the review pull request
        if: steps.build.outputs.review == '3'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changes = JSON.parse(fs.readFileSync('registry-changes.json', 'utf8'));
            const rows = changes.needs_review
              .map(c => `- **${c.kind}** \`${c.plugin_id}\` ${c.detail || ''}`)
              .join('\n');
            const body = [
              'The daily registry refresh found third-party plugin code that is new or has',
              'changed since it was last pinned. Nothing on this branch is live: deployments',
              'read `registry.json` from `main`, and a deployment refuses any plugin whose',
              'bytes do not match its pin. **Merging this pull request is the approval** that',
              'lets the new bytes reach them — review the upstream diff first.',
              '',
              '### Needs review',
              '',
              rows,
              '',
              '### Summary',
              '',
              '```',
              changes.summary,
              '```',
              '',
              'While this sits unmerged, the nightly bot force-updates this same branch with',
              'its latest rebuild, so the diff shown is always current. (A PR opened by the',
              'workflow token does not trigger CI by itself; close and reopen it if you want',
              'the checks to run.)',
            ].join('\n');

            const title = `Registry: ${changes.needs_review.length} plugin(s) need review`;
            const { data: open } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:registry-review`,
            });
            if (open.length) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: open[0].number,
                title,
                body,
              });
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                head: 'registry-review',
                base: 'main',
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['registry', 'security'],
              });
            }

      # Anything other than "clean" or "needs review" is the bot itself
      # failing, and a failure that commits nothing should not read as green.
      - name: Surface a failed rebuild
        if: steps.build.outputs.review != '0' && steps.build.outputs.review != '3'
        run: |
          echo "registry-update exited ${{ steps.build.outputs.review }}"
          exit 1
