name: pages

# Publishes the setup page — the thing the README's first link points at.
#
# Four files, and only one of them is interesting:
#
#   index.html         the page, with worker.js inlined so it can be copied
#   worker.js          the artifact, byte-identical to worker/src/worker.js
#   worker.js.sha256   so anyone can check that this is what CI published
#   version.json       what a deployed Worker's /healthz reads to know it is old
#
# There is no compiler here. `site/worker.js` is a copy, which is what makes the
# published SHA-256 worth publishing: it is the hash of a file you can read on
# GitHub and compare for yourself.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "feed/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deployment at a time, and never cancel one half-done: a cancelled deploy
# would leave the page serving a mixture of two versions, and the page's whole
# claim is that its hash matches its file.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # First, on purpose. A repository where Pages has never been switched on
      # fails here in five seconds with "Get Pages site failed: Not Found",
      # rather than twenty seconds later after the tests and the build have
      # already run for nothing.
      #
      # This step cannot switch it on. Creating a Pages site needs admin rights,
      # which GITHUB_TOKEN cannot be granted through a `permissions:` block —
      # asking anyway, with `enablement: true`, fails with "Resource not
      # accessible by integration", which is a worse error than the honest one.
      # It is one click, once, by somebody with access to the repository:
      #
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      #
      # Then re-run this workflow. Until it is done, the setup page the README
      # links to does not exist and that link 404s.
      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The artifact must not ship with a key in it
        # The build script refuses too. This is the same check said out loud,
        # because a key spliced in by accident would be one key shared by
        # everyone who ever copied the page.
        run: grep -qx 'const API_KEY = "";' worker/src/worker.js
      - name: Tests, before anything is published
        run: node --test worker/tests/worker.test.mjs
      - name: Build
        run: node worker/tools/build.mjs
      - name: Publish the hash in the log too
        run: cat site/worker.js.sha256
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
